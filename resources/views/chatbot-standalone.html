<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>AI Chatbot - Pavona Studios</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Custom animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
        .animate-bounce { animation: bounce 1s infinite; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        
        /* Mobile responsive */
        @media (max-width: 640px) {
            #chatBox { width: calc(100vw - 2rem); right: 1rem; }
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Chat Toggle Button -->
    <button id="chatToggle" class="fixed bottom-6 right-6 z-50 w-16 h-16 bg-gradient-to-r from-purple-600 to-pink-600 rounded-full shadow-lg hover:shadow-xl hover:scale-110 transition-all duration-300 flex items-center justify-center text-white">
        <svg id="chatIcon" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
        </svg>
        <svg id="closeIcon" class="w-8 h-8 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>

    <!-- Chat Box -->
    <div id="chatBox" class="fixed bottom-24 right-6 z-50 w-96 h-[500px] bg-white/95 backdrop-blur-lg rounded-2xl shadow-2xl border border-purple-200 flex-col overflow-hidden animate-fadeIn hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-purple-600 to-pink-600 text-white p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <h3 class="font-bold">Pavona AI</h3>
                    <p class="text-xs opacity-90">Online</p>
                </div>
            </div>
        </div>

        <!-- Messages Area -->
        <div id="messagesArea" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gradient-to-b from-purple-50/50 to-pink-50/50" style="height: calc(100% - 140px);">
            <!-- Initial bot message -->
            <div class="flex justify-start">
                <div class="max-w-[75%] p-3 rounded-2xl bg-white shadow-md text-gray-800 rounded-bl-none">
                    <p class="text-sm">Hi! I'm Pavona AI Assistant. How can I help you today?</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <form id="chatForm" class="p-4 bg-white border-t border-purple-100">
            <div class="flex gap-2">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type your message..."
                    class="flex-1 px-4 py-2 border border-purple-200 rounded-full focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm"
                    required
                />
                <button
                    type="submit"
                    id="sendBtn"
                    class="w-10 h-10 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-full hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 flex items-center justify-center"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
        </form>
    </div>

    <script>
        // Get CSRF token from meta tag
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content;

        // DOM elements
        const chatToggle = document.getElementById('chatToggle');
        const chatBox = document.getElementById('chatBox');
        const chatIcon = document.getElementById('chatIcon');
        const closeIcon = document.getElementById('closeIcon');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const messagesArea = document.getElementById('messagesArea');
        const sendBtn = document.getElementById('sendBtn');

        // Toggle chat box
        chatToggle.addEventListener('click', () => {
            const isHidden = chatBox.classList.contains('hidden');
            chatBox.classList.toggle('hidden');
            chatBox.classList.toggle('flex');
            chatIcon.classList.toggle('hidden');
            closeIcon.classList.toggle('hidden');
            if (isHidden) messageInput.focus();
        });

        // Add message to chat
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-[75%] p-3 rounded-2xl ${
                sender === 'user' 
                    ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-br-none' 
                    : 'bg-white shadow-md text-gray-800 rounded-bl-none'
            }`;
            
            const p = document.createElement('p');
            p.className = 'text-sm';
            p.textContent = text;
            
            bubble.appendChild(p);
            messageDiv.appendChild(bubble);
            messagesArea.appendChild(messageDiv);
            
            // Auto-scroll to bottom
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // Show typing indicator
        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'flex justify-start';
            typingDiv.innerHTML = `
                <div class="bg-white shadow-md p-3 rounded-2xl rounded-bl-none">
                    <div class="flex gap-1">
                        <span class="w-2 h-2 bg-purple-600 rounded-full animate-bounce"></span>
                        <span class="w-2 h-2 bg-purple-600 rounded-full animate-bounce delay-100"></span>
                        <span class="w-2 h-2 bg-purple-600 rounded-full animate-bounce delay-200"></span>
                    </div>
                </div>
            `;
            messagesArea.appendChild(typingDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // Remove typing indicator
        function hideTyping() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) typingIndicator.remove();
        }

        // Send message to backend
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const message = messageInput.value.trim();
            if (!message) return;
            
            // Add user message
            addMessage(message, 'user');
            messageInput.value = '';
            sendBtn.disabled = true;
            
            // Show typing indicator
            showTyping();
            
            try {
                // Send to Laravel backend
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': csrfToken,
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ message })
                });
                
                const data = await response.json();
                
                // Hide typing and show bot response
                hideTyping();
                addMessage(data.reply || 'Sorry, I could not process that.', 'bot');
                
            } catch (error) {
                hideTyping();
                addMessage('Sorry, something went wrong. Please try again.', 'bot');
            } finally {
                sendBtn.disabled = false;
                messageInput.focus();
            }
        });
    </script>

</body>
</html>
